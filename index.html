<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Key Generator</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #f5f3ef;
            --card: #ffffff;
            --accent: #0b2948;
            --muted: #6b7280;
            --glass: rgba(11, 41, 72, 0.06);
            --radius: 14px;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background:
                linear-gradient(180deg, rgba(11, 41, 72, 0.02) 0%, rgba(11, 41, 72, 0.00) 100%),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            color: var(--accent);
        }

        /* Container */
        .card {
            width: min(520px, 92vw);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(250, 248, 245, 0.98));
            border-radius: var(--radius);
            padding: 36px;
            box-shadow: 0 10px 30px rgba(11, 41, 72, 0.08), 0 1px 0 rgba(255, 255, 255, 0.6) inset;
            border: 1px solid rgba(11, 41, 72, 0.06);
            display: grid;
            gap: 18px;
        }

        /* Headline — klasik serif dokunuşu */
        h2 {
            margin: 0;
            font-family: "Playfair Display", serif;
            font-weight: 400;
            letter-spacing: 0.4px;
            color: var(--accent);
            font-size: 1.6rem;
        }

        p.lead {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        /* Form */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input#username {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(11, 41, 72, 0.06);
            background: transparent;
            font-size: 1rem;
            color: var(--accent);
            box-shadow: none;
        }

        input#username::placeholder {
            color: #9aa3ad;
        }

        button.generate-btn {
            padding: 11px 14px;
            border-radius: 10px;
            border: 0;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            min-width: 130px;
            transition: transform .14s ease, box-shadow .14s ease;
            box-shadow: 0 6px 18px rgba(11, 41, 72, 0.12);
            font-size: 0.95rem;
        }

        button.generate-btn:active {
            transform: translateY(1px) scale(.998);
        }

        button.generate-btn[disabled] {
            opacity: .6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* key output */
        #key {
            padding: 14px;
            background: var(--glass);
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--accent);
            min-height: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-all;
        }

        /* cooldown */
        .small {
            color: var(--muted);
            font-size: 0.88rem;
        }

        /* subtle decorative line */
        .rule {
            height: 1px;
            background: linear-gradient(90deg, rgba(11, 41, 72, 0.06), rgba(11, 41, 72, 0.02));
            border-radius: 1px;
            margin: 4px 0 0;
        }

        /* responsive tweaks */
        @media (max-width:420px) {
            .card {
                padding: 20px;
                gap: 12px;
            }

            button.generate-btn {
                min-width: 100px;
                font-size: 0.9rem;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="card" role="main" aria-labelledby="title">
        <h2 id="title">Generate Key</h2>
        <p class="lead">Kullanıcı adını girip "Generate" ile anahtar oluşturun. (ID'ler korunmuştur.)</p>

        <div class="controls" aria-hidden="false">
            <input id="username" placeholder="Username" aria-label="username">
            <button class="generate-btn" onclick="generate()" type="button">Generate</button>
        </div>

        <div id="key" aria-live="polite" aria-atomic="true"></div>

        <div class="rule" role="presentation"></div>
        <div class="small" id="cooldown" aria-hidden="false"></div>
    </main>
